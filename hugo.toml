# =====================================================================================
# 站点配置 —— Spark's Blog
#
# 说明：FixIt v1 的主题自带一份完整的默认配置（themes/FixIt/hugo.toml，2000+ 行）。
# 本站点只保留「必要配置 + 需要覆盖的项」，其余通过下面的 `_merge = "shallow"`
# 从主题继承，避免大量重复配置。
#
# 完整可配置项参见主题默认配置或官方文档：
#   https://fixit.lruihao.cn/zh-cn/docs/getting-started/configuration/
# =====================================================================================

# -------------------------------------------------------------------------------------
# 基础配置
# -------------------------------------------------------------------------------------

title = "Spark's Blog"

# 站点正式域名，必须以 / 结尾。
# 改这里会影响 RSS、sitemap 与社交分享的绝对链接。
# 本地预览时可用 `hugo server -b http://localhost:1313/` 临时覆盖。
baseURL = "https://blog.sparkzh.top/"

# 使用 FixIt 主题（submodule 位于 themes/FixIt）
theme = "FixIt"

# 站点默认内容语言（i18n 文件名为 zh-CN）
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
label = "简体中文"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
# 版权信息，仅用于 SEO schema
copyright = ""

enableRobotsTXT = true
enableEmoji = true

# 是否构建未来日期的内容。
# 开启后可以把文章 date 设为未来时间以实现「定时发布」：
# 提交后由 Cloudflare 定时重新构建，或在到期后重新触发部署。
buildFuture = true

# 是否使用 Git 提交记录生成 lastmod。
# 在本地已初始化 Git 的仓库中为 true；CI 环境若无 Git 历史会自动回退到文件时间。
enableGitInfo = true

# 忽略构建时的部分提示。主题开发版会提示 v1 尚未正式发布，这里是正常现象。
# 参考主题默认配置中列出的可用 message ID。
ignoreLogs = ["warning-dev-version"]

# -------------------------------------------------------------------------------------
# 必要配置：让本站点继承主题自带的 markup / outputs / taxonomies
# 不要删除，否则主题的部分功能（搜索索引、归档页、分类法）会失效。
# -------------------------------------------------------------------------------------

[markup]
_merge = "shallow"

[outputs]
_merge = "shallow"

[taxonomies]
_merge = "shallow"

# -------------------------------------------------------------------------------------
# 导航菜单
# -------------------------------------------------------------------------------------

[[menus.main]]
identifier = "posts"
name = "文章"
url = "posts/"
weight = 1

[menus.main.params]
icon = "fa-solid fa-pencil"

[[menus.main]]
identifier = "archives"
name = "归档"
url = "archives/"
weight = 2

[menus.main.params]
icon = "fa-solid fa-archive"

[[menus.main]]
identifier = "categories"
name = "分类"
url = "categories/"
weight = 3

[menus.main.params]
icon = "fa-solid fa-folder-tree"

[[menus.main]]
identifier = "tags"
name = "标签"
url = "tags/"
weight = 4

[menus.main.params]
icon = "fa-solid fa-tags"

# -------------------------------------------------------------------------------------
# 主题参数（params）
# 仅列出需要覆盖/关注的项，其余继承主题默认值。
# 注意：v1 起所有主题配置键使用 snake_case（v0.x 的 camelCase 已弃用）。
# -------------------------------------------------------------------------------------

[params]
# 主题版本标识，用于构建时校验与提示
version = "1.0.X"

# 站点描述与关键词（影响 SEO 与首页 meta）
description = "Spark 的个人博客 —— 记录技术、折腾与思考"
keywords = []

# 站点默认配色："light" | "dark" | "auto"
default_theme = "auto"

# 作者信息：用于文章页、页脚与 SEO
[params.author]
name = "Spark"
email = "Spark-CN@outlook.com"
link = "https://blog.sparkzh.top/"
# 头像文件实际位于 static/images/avatar.png，对外路径为 /images/avatar.png
avatar = "/images/avatar.png"

# 顶部标题
[params.header.title]
name = "Spark's Blog"
logo = ""
typeit = false

# 站点副标题（首页 typeit 动画）
[params.header.subtitle]
name = "记录与分享"
typeit = true

# 搜索：使用内置 Fuse.js 全文搜索，索引由主题自动生成
[params.search]
enable = true
type = "fuse"

# 首页个人资料区块（头像、标题、副标题与社交链接都在这里）。
# 主题默认 enable = false，不开启则头像与邮箱不会出现在首页。
[params.home.profile]
enable = true
# 头像取 [params.author].avatar，即 /images/avatar.png
avatar_url = ""
# 显示在头像下方的名字
title = "Spark"
subtitle = "记录与分享"
typeit = false
# 是否显示社交链接（Email 等）
social = true

# 页脚
[params.footer]
enable = true
copyright = true
author = true
# 站点创建年份，用于页脚版权区间，例如显示 2026 - 2027
since = "2026"

# 社交账号（留空即不显示）。Email 的 mailto: 前缀由主题内置映射处理。
# 完整可用列表见主题 hugo.toml 的 [params.social] 段。
[params.social]
GitHub = ""
Email = "Spark-CN@outlook.com"
RSS = true
